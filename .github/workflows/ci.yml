name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # The weekly Nixpkgs bump starts this run itself: pull requests opened with
  # the workflow token trigger no other workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Nixpkgs comes from the repository pin (nixpkgs.json), so CI evaluates
      # exactly the tree Helix builds.
      - uses: cachix/install-nix-action@v31
      - name: Validate and evaluate
        env:
          TMPDIR: /tmp
        run: |
          ./scripts/dev-shell.sh --run './scripts/check.sh --quick'
