name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Validate and evaluate
        env:
          TMPDIR: /tmp
        run: |
          export HELIX_NIXPKGS_PATH="$(nix-instantiate --find-file nixpkgs)"
          ./scripts/dev-shell.sh --run './scripts/check.sh --quick'
