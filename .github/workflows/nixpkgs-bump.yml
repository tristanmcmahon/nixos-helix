name: Nixpkgs bump

# Weekly, propose the newest NixOS release of the pinned series as one pull
# request with a version summary. It only edits nixpkgs.json: testing on
# Helix, merging and activation stay manual. State lives in pull requests,
# not in the branch: an open pull request for the release is left alone, one
# with changes beyond nixpkgs.json is never overwritten or closed, and a
# closed (unmerged) pull request for a release skips that release.
on:
  schedule:
    # Saturday 19:37 UTC: Sunday morning in New Zealand.
    - cron: "37 19 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nixpkgs-bump
  cancel-in-progress: false

env:
  BRANCH: automation/nixpkgs-bump

jobs:
  # Everything that runs Nixpkgs or repository code happens here, with a
  # read-only token that checkout does not persist.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      release: ${{ steps.decide.outputs.release }}
      pin: ${{ steps.decide.outputs.pin }}
      pr: ${{ steps.decide.outputs.pr }}
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Pin the newest release and decide what to do
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/bump-nixpkgs.sh
          release=$(jq -r .release nixpkgs.json)
          title="Bump Nixpkgs to $release"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          human=0
          open_title=
          if [[ -n $pr ]]; then
            # Any file beyond nixpkgs.json is a person's work on the pull request.
            human=$(gh pr view "$pr" --json files --jq '[.files[].path | select(. != "nixpkgs.json")] | length')
            open_title=$(gh pr view "$pr" --json title --jq .title)
          fi
          if git diff --quiet -- nixpkgs.json; then
            # main already pins the newest release.
            if [[ -n $pr ]] && ((human == 0)); then action=close; else action=none; fi
          elif [[ -n $pr && $open_title == "$title" ]]; then
            action=none
          elif [[ -n $pr ]] && ((human > 0)); then
            action=blocked
          elif gh pr list --head "$BRANCH" --state closed --limit 100 --json title --jq '.[].title' |
            grep -qxF -- "$title"; then
            # A maintainer closed this release's pull request: skip it.
            action=none
          else
            action=update
          fi
          {
            echo "action=$action"
            echo "release=$release"
            echo "pin=$(jq -c . nixpkgs.json)"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
      - name: Validate and evaluate
        if: steps.decide.outputs.action == 'update'
        env:
          TMPDIR: /tmp
        run: ./scripts/dev-shell.sh --run './scripts/check.sh --quick'
      - name: Summarise versions
        id: summary
        if: steps.decide.outputs.action == 'update'
        run: |
          # The summary informs the review; it must not block the bump.
          summary=$(./scripts/nixpkgs-version-summary.sh) ||
            summary="The version summary failed; see this workflow run's log."
          {
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

  # Writes only: commits the pin computed above and talks to GitHub. Nothing
  # from Nixpkgs or the repository runs here.
  propose:
    needs: check
    if: needs.check.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Open, update or close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.check.outputs.action }}
          RELEASE: ${{ needs.check.outputs.release }}
          PIN: ${{ needs.check.outputs.pin }}
          PR: ${{ needs.check.outputs.pr }}
          SUMMARY: ${{ needs.check.outputs.summary }}
        run: |
          case $ACTION in
          close)
            gh pr close "$PR" --delete-branch \
              --comment "\`main\` already pins $RELEASE, the newest release."
            ;;
          blocked)
            note="$RELEASE is out, but this pull request changes more than nixpkgs.json, so it was left alone. Rebase it onto the new release, or close it to get a fresh pull request."
            if ! gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF -- "$RELEASE is out"; then
              gh pr comment "$PR" --body "$note"
            fi
            ;;
          update)
            printf '%s\n' "$PIN" | jq . > nixpkgs.json
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "Weekly Nixpkgs bump by \`.github/workflows/nixpkgs-bump.yml\`; only \`nixpkgs.json\` changes. \`check.sh --quick\` passed before this was opened." \
              "$SUMMARY" \
              "Before merging, test on Helix: \`./scripts/rebuild.sh test\`, then \`helix-health --check\`.")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -C "$BRANCH"
            git commit --quiet -am "Bump Nixpkgs to $RELEASE"
            git push --force origin "$BRANCH"
            if [[ -n $PR ]]; then
              gh pr edit "$PR" --title "Bump Nixpkgs to $RELEASE" --body "$body"
            else
              gh pr create --base main --head "$BRANCH" --title "Bump Nixpkgs to $RELEASE" --body "$body"
            fi
            # A pull request opened with the workflow token starts no
            # workflows, so run the pull-request checks on the branch.
            gh workflow run ci.yml --ref "$BRANCH"
            gh workflow run emulation-ci.yml --ref "$BRANCH"
            ;;
          *)
            printf 'Unexpected action: %s\n' "$ACTION" >&2
            exit 1
            ;;
          esac
