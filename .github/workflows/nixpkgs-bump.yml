name: Nixpkgs bump

# Weekly, propose the newest NixOS release of the pinned series as one pull
# request with a version summary. It only edits nixpkgs.json: testing on
# Helix, merging and activation stay manual. State lives in pull requests,
# not in the branch: an open pull request for the release is left alone, one
# with changes beyond nixpkgs.json is never overwritten or closed, and a
# closed (unmerged) pull request for a release skips that release.
on:
  schedule:
    # Saturday 19:37 UTC: Sunday morning in New Zealand.
    - cron: "37 19 * * 6"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    # bash -eo pipefail; GitHub's default shell has no pipefail.
    shell: bash

concurrency:
  group: nixpkgs-bump
  cancel-in-progress: false

env:
  BRANCH: automation/nixpkgs-bump

jobs:
  # Everything that runs Nixpkgs or repository code happens here, with a
  # read-only token that checkout does not persist.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      base: ${{ steps.decide.outputs.base }}
      release: ${{ steps.decide.outputs.release }}
      pin: ${{ steps.decide.outputs.pin }}
      pr: ${{ steps.decide.outputs.pr }}
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      # Always main, whichever branch a manual run was started from.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Pin the newest release and decide what to do
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/bump-nixpkgs.sh
          release=$(jq -r .release nixpkgs.json)
          title="Bump Nixpkgs to $release"
          # Only pull requests this workflow opened count, never a fork's
          # branch that happens to share the name.
          pr=$(gh pr list --app github-actions --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          # A person's own pull request from this branch means the branch is
          # theirs: never delete or rebuild it.
          others=$(gh pr list --head "$BRANCH" --state open --json isCrossRepository,author \
            --jq '[.[] | select((.isCrossRepository | not) and (.author.is_bot | not))] | length')
          closed=$(gh pr list --app github-actions --head "$BRANCH" --state closed --limit 100 \
            --json title --jq '.[].title')
          human=0
          open_title=
          if [[ -n $pr ]]; then
            # Any file beyond nixpkgs.json is a person's work on the pull request.
            human=$(gh pr view "$pr" --json files --jq '[.files[].path | select(. != "nixpkgs.json")] | length')
            open_title=$(gh pr view "$pr" --json title --jq .title)
          fi
          if ((others > 0)); then
            action=none
          elif git diff --quiet -- nixpkgs.json; then
            # main already pins the newest release.
            if [[ -n $pr ]] && ((human == 0)); then action=close; else action=none; fi
          elif [[ -n $pr && $open_title == "$title" ]]; then
            action=none
          elif [[ -n $pr ]] && ((human > 0)); then
            action=blocked
          elif grep -qxF -- "$title" <<<"$closed"; then
            # A maintainer closed this release's pull request: skip it.
            action=none
          else
            action=update
          fi
          {
            echo "action=$action"
            echo "base=$(git rev-parse HEAD)"
            echo "release=$release"
            echo "pin=$(jq -c . nixpkgs.json)"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"
      - name: Validate and evaluate
        if: steps.decide.outputs.action == 'update'
        env:
          TMPDIR: /tmp
        run: ./scripts/dev-shell.sh --run './scripts/check.sh --quick'
      - name: Summarise versions
        id: summary
        if: steps.decide.outputs.action == 'update'
        run: |
          # The summary informs the review; it must not block the bump.
          summary=$(./scripts/nixpkgs-version-summary.sh) ||
            summary="The version summary failed; see this workflow run's log."
          {
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

  # Writes only, through the GitHub API: nothing is checked out and nothing
  # from Nixpkgs or the repository runs here. The branch is created at main's
  # exact commit and only nixpkgs.json is committed, so the workflow token
  # never pushes a change to workflow files, which GitHub refuses.
  propose:
    needs: check
    if: needs.check.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Open, update or close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.check.outputs.action }}
          BASE: ${{ needs.check.outputs.base }}
          RELEASE: ${{ needs.check.outputs.release }}
          PIN: ${{ needs.check.outputs.pin }}
          PR: ${{ needs.check.outputs.pr }}
          SUMMARY: ${{ needs.check.outputs.summary }}
        run: |
          case $ACTION in
          close)
            gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "\`main\` already pins $RELEASE, the newest release."
            ;;
          blocked)
            note="$RELEASE is out, but this pull request changes more than nixpkgs.json, so it was left alone. Rebase it onto the new release, or close it to get a fresh pull request."
            comments=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body')
            if ! grep -qF -- "$RELEASE is out" <<<"$comments"; then
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$note"
            fi
            ;;
          update)
            api=repos/$GITHUB_REPOSITORY
            # Each release gets its own pull request; an older automated one
            # (no changes beyond nixpkgs.json, or the check job would have
            # stopped) is superseded.
            if [[ -n $PR ]]; then
              gh pr close "$PR" --repo "$GITHUB_REPOSITORY" --delete-branch --comment "Superseded by $RELEASE."
            fi
            # A branch left behind by a closed pull request is replaced; its
            # commits stay reachable from that pull request.
            gh api -X DELETE "$api/git/refs/heads/$BRANCH" >/dev/null 2>&1 || true
            # The exact commit the check job validated, not main's head now.
            gh api "$api/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE" >/dev/null
            file=$(gh api "$api/contents/nixpkgs.json?ref=$BRANCH" --jq .sha)
            gh api -X PUT "$api/contents/nixpkgs.json" >/dev/null \
              -f message="Bump Nixpkgs to $RELEASE" \
              -f content="$(printf '%s\n' "$PIN" | jq . | base64 -w0)" \
              -f sha="$file" -f branch="$BRANCH"
            body=$(printf '%s\n\n%s\n\n%s\n' \
              "Weekly Nixpkgs bump by \`.github/workflows/nixpkgs-bump.yml\`; only \`nixpkgs.json\` changes. \`check.sh --quick\` passed before this was opened." \
              "$SUMMARY" \
              "Before merging, test on Helix: \`./scripts/rebuild.sh test\`, then \`helix-health --check\`.")
            # A pull request opened with the workflow token starts no
            # workflows, so run the pull-request checks on the branch first:
            # if that fails, no pull request exists and the next run retries.
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            gh workflow run emulation-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "Bump Nixpkgs to $RELEASE" --body "$body"
            ;;
          *)
            printf 'Unexpected action: %s\n' "$ACTION" >&2
            exit 1
            ;;
          esac
