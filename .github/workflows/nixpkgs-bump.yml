name: Nixpkgs bump

# Weekly, propose the newest NixOS release of the pinned series as a pull
# request with a version summary. It only adds: one branch and one pull
# request per release (automation/<release>), never closing,
# deleting or overwriting anything. A release that already has a pull
# request, open, merged or closed, is left alone, so closing one skips that
# release. Testing on Helix, merging and activation stay manual.
on:
  schedule:
    # Saturday 19:37 UTC: Sunday morning in New Zealand.
    - cron: "37 19 * * 6"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    # The repository's shell rules; GitHub's default shell has no pipefail.
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: nixpkgs-bump
  cancel-in-progress: false

jobs:
  # Everything that runs Nixpkgs or repository code happens here, with a
  # read-only token that checkout does not persist.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      propose: ${{ steps.decide.outputs.propose }}
      base: ${{ steps.decide.outputs.base }}
      release: ${{ steps.decide.outputs.release }}
      pin: ${{ steps.decide.outputs.pin }}
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      # Always main, whichever branch a manual run was started from.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Pin the newest release and decide whether to propose it
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(jq -r .release nixpkgs.json)
          ./scripts/bump-nixpkgs.sh
          release=$(jq -r .release nixpkgs.json)
          # nixos-26.05.<N>.<rev>: N grows with every release of the series.
          serial() {
            local rest=${1#nixos-*.*.}
            printf '%s\n' "${rest%%.*}"
          }
          propose=false
          if (($(serial "$release") <= $(serial "$current"))); then
            echo "::notice::main already pins $current, as new as the channel's $release."
          elif [[ $(gh pr list --head "automation/$release" --state all \
            --json number --jq length) != 0 ]]; then
            echo "::notice::$release already has a pull request (open, merged or closed)."
          else
            echo "::notice::Proposing $release."
            propose=true
          fi
          {
            echo "propose=$propose"
            echo "base=$(git rev-parse HEAD)"
            echo "release=$release"
            echo "pin=$(jq -c . nixpkgs.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Validate and evaluate
        if: steps.decide.outputs.propose == 'true'
        env:
          TMPDIR: /tmp
        run: ./scripts/dev-shell.sh --run './scripts/check.sh --quick'
      - name: Summarise versions
        id: summary
        if: steps.decide.outputs.propose == 'true'
        run: |
          # The summary informs the review; it must not block the bump.
          summary=$(./scripts/nixpkgs-version-summary.sh) ||
            summary="The version summary failed; see this workflow run's log."
          {
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

  # Writes only, through the GitHub API: nothing is checked out and nothing
  # from Nixpkgs or the repository runs here. The branch starts at the exact
  # commit the check job validated and only nixpkgs.json is committed, so
  # the workflow token never pushes workflow-file changes, which GitHub
  # refuses. A run that stopped halfway is redone by the next one.
  propose:
    needs: check
    if: needs.check.outputs.propose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.check.outputs.base }}
          RELEASE: ${{ needs.check.outputs.release }}
          PIN: ${{ needs.check.outputs.pin }}
          SUMMARY: ${{ needs.check.outputs.summary }}
        run: |
          api=repos/$GITHUB_REPOSITORY
          branch=automation/$RELEASE
          exists=$(gh api "$api/git/matching-refs/heads/$branch" \
            --jq "map(select(.ref == \"refs/heads/$branch\")) | length")
          if ((exists == 0)); then
            gh api "$api/git/refs" -f ref="refs/heads/$branch" -f sha="$BASE" >/dev/null
          else
            # Left by a run that stopped before opening the pull request (the
            # check job found none): restart it from the commit just validated.
            gh api -X PATCH "$api/git/refs/heads/$branch" -f sha="$BASE" -F force=true >/dev/null
          fi
          gh api -X PUT "$api/contents/nixpkgs.json" >/dev/null \
            -f message="Bump Nixpkgs to $RELEASE" \
            -f content="$(printf '%s\n' "$PIN" | jq . | base64 -w0)" \
            -f sha="$(gh api "$api/contents/nixpkgs.json?ref=$branch" --jq .sha)" \
            -f branch="$branch"
          # A pull request opened with the workflow token starts no
          # workflows, so run the pull-request checks on the branch first.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run emulation-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          older=$(gh pr list --repo "$GITHUB_REPOSITORY" --app github-actions --state open \
            --search "\"Bump Nixpkgs to\" in:title" --json number --jq 'map("#\(.number)") | join(", ")')
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Weekly Nixpkgs bump by \`.github/workflows/nixpkgs-bump.yml\`; only \`nixpkgs.json\` changes. \`check.sh --quick\` passed before this was opened." \
            "$SUMMARY" \
            "Before merging, test on Helix: \`./scripts/rebuild.sh test\`, then \`helix-health --check\`. If main has moved since, press **Update branch** first so CI runs on the merged tree.")
          if [[ -n $older ]]; then
            body+=$'\n\n'"Older bump pull requests still open: $older. Close them once this one is merged."
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Bump Nixpkgs to $RELEASE" --body "$body"
