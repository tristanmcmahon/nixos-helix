name: NVIDIA 620 promotion probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Derive exact 620.70.06 hashes
        run: |
          bash ./scripts/helix-nvidia620-test.sh prepare
          echo '=== CANDIDATE CONFIG ==='
          cat "$HOME/.local/state/helix/nvidia-620.70.06/configuration.nix"
      - name: Build NVIDIA 620 user space and open kernel module
        run: |
          source ./scripts/release-environment.sh
          cfg="$HOME/.local/state/helix/nvidia-620.70.06/configuration.nix"
          user=$(nix-build --no-out-link '<nixpkgs/nixos>'             -A config.hardware.nvidia.package             -I "nixos-config=$cfg")
          open=$(nix-build --no-out-link '<nixpkgs/nixos>'             -A config.hardware.nvidia.package.open             -I "nixos-config=$cfg")
          echo "userspace=$user"
          echo "open_module=$open"
