name: Release CI

on:
  workflow_dispatch:
  # Weekly on the default branch only, so a broken release gate is noticed
  # within a week; pushes to release branches still never start this build.
  schedule:
    - cron: "17 14 * * 6"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # Nixpkgs comes from the repository pin (nixpkgs.json), so CI evaluates
      # exactly the tree Helix builds.
      - uses: cachix/install-nix-action@v31
      - name: Full release validation
        env:
          TMPDIR: /tmp
        run: |
          ./scripts/dev-shell.sh --run './scripts/check.sh --full'
