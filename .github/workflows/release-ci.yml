name: Release CI

# Manual only. GitHub-hosted runners cannot build the CUDA Ollama and MAME
# closures within the job time limit, so the weekly schedule only ever
# produced cancelled runs. The release gate runs on Helix before tagging,
# where those builds are already in the store.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # Nixpkgs comes from the repository pin (nixpkgs.json), so CI evaluates
      # exactly the tree Helix builds.
      - uses: cachix/install-nix-action@v31
      - name: Full release validation
        env:
          TMPDIR: /tmp
        run: |
          ./scripts/dev-shell.sh --run './scripts/check.sh --full'
