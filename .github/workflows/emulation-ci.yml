name: Emulation CI

on:
  push:
    paths:
      - configuration.nix
      - profiles/emulation.nix
      - .github/workflows/emulation-ci.yml
  pull_request:
    paths:
      - configuration.nix
      - profiles/emulation.nix
      - .github/workflows/emulation-ci.yml

permissions:
  contents: read

jobs:
  build-emulation-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Build Helix with emulation enabled
        run: |
          nix-build --no-out-link '<nixpkgs/nixos>' -A system \
            -I "nixos-config=$PWD/configuration.nix"
