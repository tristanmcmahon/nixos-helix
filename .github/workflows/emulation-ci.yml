name: Emulation CI

on:
  push:
    branches: [ main ]
    paths:
      - configuration.nix
      - profiles/hamcade.nix
      - profiles/emulation.nix
      - 'profiles/emulation/**'
      - vendor/hamcade/dependencies.nix
      - config/infernalnexus.nix
      - tests/invariants/emulation.nix
      - tests/emulation-configuration.nix
      - tests/emulation-disabled.nix
      - .github/workflows/emulation-ci.yml
  pull_request:
    paths:
      - configuration.nix
      - profiles/hamcade.nix
      - profiles/emulation.nix
      - 'profiles/emulation/**'
      - vendor/hamcade/dependencies.nix
      - config/infernalnexus.nix
      - tests/invariants/emulation.nix
      - tests/emulation-configuration.nix
      - tests/emulation-disabled.nix
      - .github/workflows/emulation-ci.yml

permissions:
  contents: read

concurrency:
  group: emulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Evaluate isolated emulation configuration
        run: |
          nix-instantiate '<nixpkgs/nixos>' -A system             -I "nixos-config=$PWD/tests/emulation-configuration.nix" >/dev/null
      - name: Prove the subsystem disappears when disabled
        run: nix-instantiate --eval --strict tests/emulation-disabled.nix
